spring.application.name=backend

# Database Configuration - MySQL for local development
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/reservecut}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:a98UT7HFe2*a}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=0

# Tomcat File Upload Configuration
server.tomcat.max-http-form-post-size=15728640
server.tomcat.max-swallow-size=-1
server.tomcat.max-file-upload-count=-1

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:freelivebusnisse@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:bcfydsnpmmnrytwe}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Verification Configuration
app.verification.code-expiry-minutes=10
app.verification.email-from=ReserveCut <noreply@reservecut.com>

# CORS Configuration (Add your Railway frontend URL)
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}

# Frontend URL for OAuth2 redirects
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.provider.google.user-name-attribute=email

